    <style>
        :root {
            --bg-color: #20232a;
            --text-color: #fff;
            --accent: #61dafb;
            --card-width: 40vw;
            --card-max-width: 250px;
        }

        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #2c313c 0%, #20232a 100%);
            color: var(--text-color);
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar Styles */
        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: flex-start;
            gap: 3rem;
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            color: var(--accent);
            font-weight: 800;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            opacity: 0.7;
            white-space: nowrap;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
            opacity: 1;
        }

        .burger-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            margin-left: auto;
        }

        .burger-bar {
            width: 25px;
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .navbar {
                justify-content: space-between;
                gap: 0;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                flex-direction: column;
                background: #2c313c;
                padding: 1rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                align-items: center;
                gap: 1rem;
                z-index: 200;
            }

            .nav-links.active {
                display: flex;
            }

            .burger-menu {
                display: flex;
            }

            .game-area {
                flex-direction: column;
                gap: 1rem;
            }
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            padding: 1rem;
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            /* background: linear-gradient(to right, #61dafb, #d6d6d6); */
            -webkit-background-clip: text;
            background-clip: text;
            /* -webkit-text-fill-color: transparent; */
            text-shadow: 0 0 20px rgba(97, 218, 251, 0.3);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #aaa;
            margin-top: -0.5rem;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .score-board {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            width: 100%;
        }

        .card-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card-image {
            width: var(--card-width);
            max-width: var(--card-max-width);
            aspect-ratio: 63 / 88;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            background: #1a1c22;
            transition: transform 0.3s ease, opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .card-image.loaded {
            animation: fadeInSlide 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Overlay specific to Higher/Lower right card */
        .hidden-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
            transition: opacity 0.5s ease;
            opacity: 0;
            /* Hidden by default via class toggle */
            pointer-events: none;
        }

        .hidden-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .mana-circles {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .vs-text {
            font-size: 2rem;
            font-weight: bold;
            color: #888;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 20;
        }

        .btn-action {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-up {
            background: #4caf50;
            color: white;
        }

        .btn-up:hover {
            background: #43a047;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-up:active {
            transform: scale(0.98);
        }

        .btn-down {
            background: #f44336;
            color: white;
        }

        .btn-down:hover {
            background: #e53935;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-down:active {
            transform: scale(0.98);
        }

        .result-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .result-overlay.show {
            opacity: 1;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.5);
            }

            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @media (max-width: 600px) {
            .game-area {
                flex-direction: column;
                gap: 1rem;
            }

            .controls {
                flex-direction: row;
                /* Put controls below first card on mobile logic if we want, but usually standard flow is top-down */
            }

            .card-image {
                width: 60vw;
            }

            /* On mobile, standard user flow: 
           [Left Card]
           [Buttons]
           [Right Card (Hidden)]
        */
            .game-area {
                flex-direction: column;
            }
        }

        /* Hide mana cost visual */
        .mana-hider {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 35%;
            height: 12%;
            background: #20232a;
            border-radius: 4px;
            z-index: 5;
        }

        /* Timed Mode Styles */
        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .mode-btn:hover,
        .mode-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        #timer-container {
            color: var(--accent);
            font-weight: bold;
            display: inline-block;
        }

        .timer-low {
            color: #f44336 !important;
            animation: pulse-red 0.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* Accessibility: Reduced motion support */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .card-image.loaded {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

    <script>
        let leftCard = null;
        let rightCard = null;
        let score = 0;
        let isLoading = false;
        let isTimedMode = false;
        let timeLeft = 60;
        let timerInterval = null;

        let nextCardPromise = null; // Deprecated by queue

        // Fetch a new random card
        async function fetchCard() {
            try {
                const res = await fetch('/get_card?new_card=true&mode=higher_lower');
                const data = await res.json();
                return data; // { name, image, mana_cost, cmc }
            } catch (e) {
                console.error("Failed to fetch card", e);
                return null; // Handle error gracefully
            }
        }

        function switchMode(mode) {
            if (isLoading) return; // Prevent switching mid-load

            if (mode === 'timed') {
                isTimedMode = true;
                document.getElementById('btn-timed').classList.add('active');
                document.getElementById('btn-normal').classList.remove('active');
                document.getElementById('timer-display').style.display = 'inline';
            } else {
                isTimedMode = false;
                document.getElementById('btn-normal').classList.add('active');
                document.getElementById('btn-timed').classList.remove('active');
                document.getElementById('timer-display').style.display = 'none';
                stopTimer();
            }
            initGame();
        }

        async function initGame() {
            score = 0;
            updateScore();
            stopTimer();

            isLoading = true;

            // Show loading on both slots
            document.getElementById('left-slot').classList.add('loading');
            document.getElementById('right-slot').classList.add('loading');

            // Fetch two cards directly
            [leftCard, rightCard] = await Promise.all([fetchCard(), fetchCard()]);

            document.getElementById('left-slot').classList.remove('loading');
            document.getElementById('right-slot').classList.remove('loading');

            // Ensure they aren't the same card (unlikely but possible)
            while (leftCard && rightCard && leftCard.name === rightCard.name) {
                rightCard = await fetchCard();
            }

            if (isTimedMode) {
                timeLeft = 60;
                updateTimerDisplay();
            }

            // Notify backend of reset (and mode)
            await fetch('/reset_game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: isTimedMode ? 'timed' : 'classic' })
            });

            render();
        }

        function render() {
            if (!leftCard || !rightCard) return;

            // Left Card
            const imgLeft = document.getElementById('img-left');
            imgLeft.classList.remove('loaded');
            imgLeft.src = leftCard.image;
            imgLeft.alt = leftCard.name;
            // Check if image is already loaded (cached)
            if (imgLeft.complete) {
                setTimeout(() => imgLeft.classList.add('loaded'), 10);
            } else {
                imgLeft.onload = () => {
                    setTimeout(() => imgLeft.classList.add('loaded'), 10);
                };
            }
            document.getElementById('cmc-left').textContent = leftCard.cmc;

            // Right Card
            const imgRight = document.getElementById('img-right');
            imgRight.classList.remove('loaded');
            imgRight.src = rightCard.image;
            imgRight.alt = rightCard.name;
            // Check if image is already loaded (cached)
            if (imgRight.complete) {
                setTimeout(() => imgRight.classList.add('loaded'), 10);
            } else {
                imgRight.onload = () => {
                    setTimeout(() => imgRight.classList.add('loaded'), 10);
                };
            }
            document.getElementById('cmc-right').textContent = rightCard.cmc;

            // Reset Right visuals
            document.getElementById('mana-hider').style.display = 'block';
            document.getElementById('cmc-right-display').style.opacity = '0';
            document.getElementById('result-icon').className = 'result-overlay';
            document.getElementById('result-icon').textContent = '';

            isLoading = false;

            // Resume/Start timer if in timed mode
            if (isTimedMode && timeLeft > 0) {
                startTimer();
            }
        }

        async function nextRound() {
            // Move Right card to Left
            leftCard = rightCard;

            // Show loading on right slot
            document.getElementById('right-slot').classList.add('loading');
            rightCard = await fetchCard();
            document.getElementById('right-slot').classList.remove('loading');

            if (rightCard) {
                render();
            } else {
                // If fetch failed, try one more time or alert?
                isLoading = false;
                alert("Failed to load next card. Please refresh.");
            }
        }

        async function submitToLeaderboard(score, streak = 0) {
            const username = prompt("🏆 Enter your name for the leaderboard (or leave blank for Anonymous):") || "Anonymous";

            try {
                const response = await fetch('/api/submit_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        game_mode: 'higher_lower',
                        score: score,
                        streak: streak,
                        username: username.trim().substring(0, 50)
                    })
                });

                const result = await response.json();

                if (result.rank) {
                    alert(`🎉 You ranked #${result.rank} on the leaderboard!`);
                }
            } catch (error) {
                console.error('Failed to submit score:', error);
            }
        }

        async function gameOver() {
            stopTimer();
            alert(`Game Over! Final Score: ${score}`);

            // Submit to leaderboard
            await submitToLeaderboard(score);

            initGame();
        }

        function startTimer() {
            if (timerInterval) return; // Already running
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timer');
            timerEl.textContent = timeLeft;
            if (timeLeft <= 10) {
                timerEl.classList.add('timer-low');
            } else {
                timerEl.classList.remove('timer-low');
            }
        }

        function guess(direction) {
            if (isLoading) return;
            isLoading = true;

            // Pause timer IMMEDIATELY so animation/load time doesn't count
            if (isTimedMode) stopTimer();

            // Reveal
            document.getElementById('mana-hider').style.display = 'none';
            document.getElementById('cmc-right-display').style.opacity = '1';

            const leftCMC = parseFloat(leftCard.cmc);
            const rightCMC = parseFloat(rightCard.cmc);

            let isCorrect = false;

            if (direction === 'higher') {
                isCorrect = rightCMC >= leftCMC;
            } else {
                isCorrect = rightCMC <= leftCMC;
            }

            // Show result icon
            const resultEl = document.getElementById('result-icon');
            resultEl.textContent = isCorrect ? '✅' : '❌';
            resultEl.classList.add('show');

            if (isCorrect) {
                score++;
                updateScore();

                // PERFORMANCE: Start fetching *immediately* while animation plays
                // nextRound will handle the fetch now.

                setTimeout(nextRound, 1500); // Wait 1.5s to show result then next
            } else {
                // In timed mode, wrong answer doesn't end game immediately, 
                // but we might want a small penalty or just continue?
                // Plan said "Infinite lives", so we just continue.
                // However, user usually wants to know they failed.
                // We'll just show X and continue to next round if timed mode.

                if (isTimedMode) {
                    // Wait to show X, then NEXT card, don't reset score, just time/streak penalty
                    // Since we are scoring by "Total Correct", we just move on.
                    setTimeout(nextRound, 1500);
                } else {
                    setTimeout(gameOver, 1500);
                }
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
