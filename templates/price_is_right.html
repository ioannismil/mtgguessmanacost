    <style>
        :root {
            --bg-color: #20232a;
            --text-color: #fff;
            --accent: #61dafb;
            --gold: #ffd700;
            --green: #4caf50;
            --red: #f44336;
        }

        body {
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #2c313c 0%, #20232a 100%);
            color: var(--text-color);
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: flex-start;
            gap: 3rem;
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            color: var(--accent);
            font-weight: 800;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.7;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
            opacity: 1;
        }

        .burger-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            margin-left: auto;
        }

        .burger-bar {
            width: 25px;
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-top: 1rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-weight: 800;
        }

        .subtitle {
            color: #aaa;
            margin-top: -0.5rem;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .score-board {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            font-size: 1.3rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }

        .score-board span {
            color: var(--gold);
            font-weight: bold;
        }

        .instruction {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        .card-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-wrapper:hover:not(.revealed) {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(97, 218, 251, 0.3);
        }

        .card-wrapper.selected {
            box-shadow: 0 0 20px rgba(97, 218, 251, 0.6);
            transform: scale(1.02);
        }

        .card-wrapper.correct {
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
            animation: correctPulse 0.5s ease-in-out;
        }

        .card-wrapper.incorrect {
            box-shadow: 0 0 30px rgba(244, 67, 54, 0.8);
            animation: shake 0.5s;
        }

        @keyframes correctPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .card-image {
            width: 100%;
            aspect-ratio: 63 / 88;
            object-fit: cover;
            border-radius: 12px;
            background: #1a1c22;
            display: block;
        }

        .price-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 70%, transparent 100%);
            padding: 1.5rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-wrapper.revealed .price-overlay {
            transform: translateY(0);
        }

        .price-tag {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .result-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 2.5rem;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-wrapper.revealed .result-badge {
            opacity: 1;
            transform: scale(1);
        }

        /* Success Modal */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .success-modal.show {
            display: flex;
        }

        .success-content {
            background: linear-gradient(135deg, #2c313c 0%, #1a1c22 100%);
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--green);
            max-width: 400px;
            width: 90%;
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 3rem;
            color: var(--green);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .success-message {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .modal-next-btn {
            padding: 1rem 3rem;
            font-size: 1.3rem;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .modal-next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.6);
            background: #45a049;
        }


        @media (max-width: 768px) {
            .navbar {
                justify-content: space-between;
                gap: 0;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                flex-direction: column;
                background: #2c313c;
                padding: 1rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                align-items: center;
                gap: 1rem;
            }

            .nav-links.active {
                display: flex;
            }

            .burger-menu {
                display: flex;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                max-width: 400px;
            }

            .price-tag {
                font-size: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .cards-grid {
                max-width: 700px;
            }
        }

        /* Loading state */
        .card-wrapper.loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .card-wrapper.loading::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.1) 50%,
                    transparent 100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body>

        <div class="burger-menu" onclick="toggleNav()">
            <div class="burger-bar"></div>
            <div class="burger-bar"></div>

    <div class="game-container">

        </div>

    <script>
        let cards = [];
        let score = 0;
        let selectedIndex = null;
        let isRevealed = false;
        let isLoading = false;

        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        async function fetchCard() {
            try {
                const res = await fetch('/get_card?new_card=true&mode=price_is_right');
                const data = await res.json();

                // Validate it has a price
                if (!data.prices || (!data.prices.usd && !data.prices.usd_foil)) {
                    console.warn("Card missing USD price, retrying...", data);
                    return await fetchCard();
                }
                return data;
            } catch (e) {
                console.error("Fetch failed", e);
                return null;
            }
        }

        function getPrice(card) {
            if (!card || !card.prices) return 0;
            // Prefer USD, then USD Foil
            if (card.prices.usd) return parseFloat(card.prices.usd);
            if (card.prices.usd_foil) return parseFloat(card.prices.usd_foil);
            return 0;
        }

        async function initGame() {
            score = 0;
            document.getElementById('score').textContent = score;
            await loadRound();
        }

        async function loadRound() {
            isLoading = true;
            isRevealed = false;
            selectedIndex = null;
            cards = [];

            // Show loading state
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper loading';
                wrapper.innerHTML = '<div class="card-image"></div>';
                grid.appendChild(wrapper);
            }

            // Hide modal (if showing)
            document.getElementById('success-modal').classList.remove('show');
            document.getElementById('instruction').textContent = 'Loading cards...';

            // Fetch 4 cards
            const fetchPromises = [];
            for (let i = 0; i < 4; i++) {
                fetchPromises.push(fetchCard());
            }

            cards = await Promise.all(fetchPromises);

            // Ensure no duplicate cards
            const names = new Set();
            for (let i = 0; i < cards.length; i++) {
                while (names.has(cards[i].name)) {
                    cards[i] = await fetchCard();
                }
                names.add(cards[i].name);
            }

            renderCards();
            isLoading = false;
            document.getElementById('instruction').textContent = 'Click on the card you think costs the most!';
        }

        function renderCards() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            cards.forEach((card, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                wrapper.onclick = () => selectCard(index);

                const price = getPrice(card);

                wrapper.innerHTML = `
                    <img src="${card.image}" alt="${card.name}" class="card-image">
                    <div class="price-overlay">
                        <div class="price-tag">$${price.toFixed(2)}</div>
                    </div>
                    <div class="result-badge"></div>
                `;

                grid.appendChild(wrapper);
            });
        }

        function selectCard(index) {
            if (isRevealed || isLoading) return;

            selectedIndex = index;
            isRevealed = true;

            // Disable instruction
            document.getElementById('instruction').textContent = '';

            // Find the most expensive card
            let maxPrice = 0;
            let maxIndex = 0;
            cards.forEach((card, i) => {
                const price = getPrice(card);
                if (price > maxPrice) {
                    maxPrice = price;
                    maxIndex = i;
                }
            });

            const isCorrect = selectedIndex === maxIndex;

            // Reveal all cards and mark them
            const wrappers = document.querySelectorAll('.card-wrapper');
            wrappers.forEach((wrapper, i) => {
                wrapper.classList.add('revealed');
                wrapper.style.pointerEvents = 'none';

                const badge = wrapper.querySelector('.result-badge');

                if (i === maxIndex) {
                    // This is the correct answer
                    wrapper.classList.add('correct');
                    badge.textContent = '🏆';
                } else if (i === selectedIndex) {
                    // User selected this but it's wrong
                    wrapper.classList.add('incorrect');
                    badge.textContent = '❌';
                }
            });

            // Update score and show modal or game over
            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;

                // Show success modal after animation
                setTimeout(() => {
                    document.getElementById('success-modal').classList.add('show');
                }, 800);
            } else {
                // Game over
                setTimeout(async () => {
                    alert(`Game Over! Final Score: ${score}`);

                    // Submit to leaderboard
                    await submitToLeaderboard(score);

                    // Reset game
                    initGame();
                }, 1500);
            }
        }

        async function nextRound() {
            // Hide modal
            document.getElementById('success-modal').classList.remove('show');
            await loadRound();
        }

        async function submitToLeaderboard(finalScore) {
            const username = prompt("🏆 Enter your name for the leaderboard (or leave blank for Anonymous):") || "Anonymous";

            try {
                const response = await fetch('/api/submit_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        game_mode: 'price_is_right',
                        score: finalScore,
                        streak: 0,
                        username: username.trim().substring(0, 50)
                    })
                });

                const result = await response.json();

                if (result.rank) {
                    alert(`🎉 You ranked #${result.rank} on the leaderboard!`);
                }
            } catch (error) {
                console.error('Failed to submit score:', error);
            }
        }

        // Start the game
        initGame();

    </script>
