    <script>
        let leftCard = null;
        let rightCard = null;
        let score = 0;
        let isLoading = false;

        // We can reuse the queue concept if we want, but for simplicity let's do direct fetch first then optimize if needed.
        // Actually, queue is great for UX. Let's start simple though.

        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        async function fetchCard() {
            try {
                // Force new card, mode=price_is_right
                const res = await fetch('/get_card?new_card=true&mode=price_is_right');
                const data = await res.json();

                // Validate it has a price
                if (!data.prices || (!data.prices.usd && !data.prices.usd_foil)) {
                    console.warn("Card missing USD price, retrying...", data);
                    return await fetchCard();
                }
                return data;
            } catch (e) {
                console.error("Fetch failed", e);
                return null;
            }
        }

        function getPrice(card) {
            if (!card || !card.prices) return 0;
            // Prefer USD, then USD Foil
            if (card.prices.usd) return parseFloat(card.prices.usd);
            if (card.prices.usd_foil) return parseFloat(card.prices.usd_foil);
            return 0;
        }

        async function initGame() {
            isLoading = true;
            leftCard = await fetchCard();
            rightCard = await fetchCard();

            // Ensure differents
            while (leftCard.name === rightCard.name) {
                rightCard = await fetchCard();
            }

            render();
            isLoading = false;
        }

        function render() {
            if (!leftCard || !rightCard) return;

            // Left
            const imgLeft = document.getElementById('img-left');
            imgLeft.src = leftCard.image;
            imgLeft.alt = leftCard.name;
            document.getElementById('price-left').textContent = getPrice(leftCard).toFixed(2);

            // Right
            const imgRight = document.getElementById('img-right');
            imgRight.src = rightCard.image;
            imgRight.alt = rightCard.name;
            document.getElementById('price-right').textContent = getPrice(rightCard).toFixed(2);

            // Hide right Price
            const rightPriceTag = document.querySelector('#right-slot .price-tag');
            rightPriceTag.style.background = 'transparent';
            rightPriceTag.style.border = '2px dashed #888';
            rightPriceTag.style.color = 'transparent';
            document.getElementById('price-right').style.opacity = '0';

            document.getElementById('result-icon').className = 'result-overlay';
            document.getElementById('result-icon').textContent = '';
        }

        async function nextRound() {
            leftCard = rightCard;
            rightCard = await fetchCard();
            render();
            isLoading = false;
        }

        function guess(direction) {
            if (isLoading) return;
            isLoading = true;

            const p1 = getPrice(leftCard);
            const p2 = getPrice(rightCard);

            // Reveal
            const rightPriceTag = document.querySelector('#right-slot .price-tag');
            rightPriceTag.style.background = 'rgba(0,0,0,0.6)';
            rightPriceTag.style.border = 'none';
            rightPriceTag.style.color = '#81c784';
            document.getElementById('price-right').style.opacity = '1';

            let correct = false;
            if (direction === 'higher') correct = p2 >= p1;
            else correct = p2 <= p1;

            const resEl = document.getElementById('result-icon');
            resEl.textContent = correct ? '✅' : '❌';
            resEl.classList.add('show');

            if (correct) {
                score++;
                document.getElementById('score').textContent = score;
                setTimeout(nextRound, 1500);
            } else {
                // Game Over? Or just reset streak? 
                // In typical Higher Lower, game ends.
                setTimeout(() => {
                    alert(`Game Over! Final Score: ${score}`);
                    score = 0;
                    document.getElementById('score').textContent = score;
                    initGame();
                }, 1000);
            }
        }

        initGame();

    </script>
