            aspect-ratio: 63/88;
            max-width: 350px;
        }

        .art-image {

            transition: filter 0.3s ease, opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);

            }

            opacity: 0.6;
            filter: grayscale(0.8);

                    <label class="format-checkbox">
                        <input type="checkbox" class="format-option" value="pauper">
                        <span class="format-label">Pauper</span>
                    </label>
                </div>
            </div>

            <div style="text-align:center; margin-top:1.5rem; display:flex; gap:10px; justify-content:center;">
                <button onclick="resetFilters()" class="filter-toggle-btn"
                    style="font-size:0.85rem; padding:0.4rem 1rem;">
                    Reset to Default
                </button>
            </div>
        </div>

        <div class="art-frame">
            <img id="art-display" class="art-image" src="" alt="Mystery Art">
            <div id="loading-overlay"
                style="position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; opacity:0; transition:opacity 0.2s;">
                <span>Loading...</span>
            </div>
        </div>

        <div class="controls">
            <div class="controls">
                <!-- Color Mode Controls -->
                <div id="color-controls"
                    style="width:100%; display:flex; flex-direction:column; align-items:center; gap:1.5rem;">
                    <div style="color: #ccc; margin-bottom: -10px;">Select Color Identity:</div>
                    <div class="color-toggles">
                        <div class="color-btn btn-w" onclick="toggleColor('W')"><span class="color-symbol">W</span>
                        </div>
                        <div class="color-btn btn-u" onclick="toggleColor('U')"><span class="color-symbol">U</span>
                        </div>
                        <div class="color-btn btn-b" onclick="toggleColor('B')"><span class="color-symbol">B</span>
                        </div>
                        <div class="color-btn btn-r" onclick="toggleColor('R')"><span class="color-symbol">R</span>
                        </div>
                        <div class="color-btn btn-g" onclick="toggleColor('G')"><span class="color-symbol">G</span>
                        </div>
                        <div class="color-btn btn-c" onclick="toggleColor('C')"><span class="color-symbol">◇</span>
                        </div>
                    </div>
                    <button id="submit-btn" class="submit-btn" onclick="submitGuess()">GUESS</button>
                </div>

                <!-- Name Mode Controls -->
                <div id="name-controls" class="name-options" style="align-items:center;">
                    <div class="name-input-wrapper">
                        <input type="text" id="card-name-input" class="name-input" placeholder="Type card name..."
                            autocomplete="off">
                        <div id="suggestions" class="suggestions-list"></div>
                    </div>
                    <button class="submit-btn" onclick="submitNameGuess()" style="margin-top: 10px;">GUESS</button>
                </div>

                <button id="next-btn" class="submit-btn" onclick="loadCard()"
                    style="display:none; background:#4caf50;">Next Card ➜</button>
            </div>

            <div class="result-panel" id="result-message"></div>
            <div class="reveal-info" id="reveal-area">
                <div id="card-name" style="color: #fff; font-weight: bold; font-size: 1.1rem; margin-bottom: 5px;">
                </div>
                <div id="actual-colors"></div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="game-over-modal">
            <div class="game-over-content">
                <h2 style="font-size: 3rem; margin: 0 0 1rem; color: #f44336;">Game Over</h2>
                <p style="font-size: 1.5rem; margin-bottom: 2rem;">Final Score: <span id="final-score"
                        style="color: var(--accent); font-weight:bold">0</span></p>
                <button class="play-again-btn" onclick="resetGame()">Play Again ↻</button>
            </div>
        </div>
        <footer
            style="margin-top: 3rem; padding: 2rem; color: #666; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); width: 100%;">
            <div style="display: flex; gap: 20px;">
                <a href="https://x.com/ioannis_mtd" target="_blank" title="X (Twitter)"
                    style="color: #888; text-decoration: none; display: flex; align-items: center; transition: color 0.2s;">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path
                            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                    </svg>
                </a>
                <a href="https://bsky.app/profile/ioannismi.bsky.social" target="_blank" title="Bluesky"
                    style="color: #888; text-decoration: none; display: flex; align-items: center; transition: color 0.2s;">
                    <svg viewBox="0 0 600 530" width="24" height="24" fill="currentColor">
                        <path
                            d="m135.72 44.03c66.496 49.921 138.02 151.14 164.28 205.46 26.262-54.316 97.782-155.54 164.28-205.46 47.98-36.021 125.72-63.892 125.72 24.795 0 17.712-10.155 148.79-16.111 200.96-4.526 39.663-31.455 71.257-71.706 80.8-92.488 21.93-131.26 39.187-157.96 128.75-5.307 17.799-9.859 34.346-12.758 45.468-1.503 5.313-2.679 9.873-3.468 12.589-1.22 3.681-2.923 3.682-4.143 0-.79-2.716-1.966-7.276-3.469-12.589-2.9-11.122-7.46-27.674-12.767-45.474-26.7-89.559-65.48-106.82-157.96-128.75-40.25-9.543-67.18-41.137-71.706-80.8-5.956-52.17-16.111-183.25-16.111-200.96 0-88.687 77.74-60.816 125.72-24.795z" />
                    </svg>
                </a>
            </div>
            <a href="/privacy" style="color: #666; text-decoration: none; border-bottom: 1px dotted #666;">Privacy
                Policy</a>
        </footer>
        <script>
            let currentCard = null;
            let selectedColors = new Set();
            let score = 0;
            let lives = 3;
            let isRevealed = false;
            let gameMode = 'color'; // 'color' or 'name'

            function setMode(mode) {
                if (gameMode === mode) return; // No change

                // Confirm reset if in middle of game? 
                // User requirement: "reset the game"
                // So we always reset.
                gameMode = mode;

                // Toggle UI classes
                const btns = document.querySelectorAll('.mode-toggle-btn');
                btns.forEach(b => b.classList.remove('active'));
                if (mode === 'color') btns[0].classList.add('active');
                else btns[1].classList.add('active');

                // Toggle Controls
                if (mode === 'color') {
                    document.getElementById('color-controls').style.display = 'flex';
                    document.getElementById('name-controls').classList.remove('active');
                } else {
                    document.getElementById('color-controls').style.display = 'none';
                    document.getElementById('name-controls').classList.add('active');
                    // Setup autocomplete listeners if not already?
                    setupAutocomplete();
                }

                resetGame(); // Trigger full reset
            }

            function toggleNav() {
                document.getElementById('navLinks').classList.toggle('active');
            }

            function toggleColor(color) {
                if (isRevealed) return;

                if (color === 'C') {
                    // Logic: Is Colorless exclusive? 
                    // In MTG identity, Colorless is usually absence of colors. 
                    // But user might want to explicitly say "This is colorless".
                    // Let's make it toggle others off if C is clicked, or C off if others clicked?
                    // Actually, let's just treat it as a toggle. If C is selected, we expect identity to be empty.
                    if (selectedColors.has('C')) {
                        selectedColors.delete('C');
                    } else {
                        selectedColors.clear();
                        selectedColors.add('C');
                    }
                } else {
                    // If selecting a color, unselect C
                    if (selectedColors.has('C')) selectedColors.delete('C');

                    if (selectedColors.has(color)) {
                        selectedColors.delete(color);
                    } else {
                        selectedColors.add(color);
                    }
                }
                updateButtons();
            }

            function updateButtons() {
                document.querySelectorAll('.color-btn').forEach(btn => {
                    btn.classList.remove('selected');
                });

                selectedColors.forEach(c => {
                    const btn = document.querySelector(`.btn-${c.toLowerCase()}`);
                    if (btn) btn.classList.add('selected');
                });
            }

            async function loadCard() {
                isRevealed = false;
                selectedColors.clear();
                updateButtons();
                document.getElementById('result-message').textContent = '';
                document.getElementById('reveal-area').style.display = 'none';
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').textContent = "GUESS";
                document.getElementById('submit-btn').textContent = "GUESS";
                document.getElementById('loading-overlay').style.opacity = '1';
                document.getElementById('next-btn').style.display = 'none';
                if (gameMode === 'color') document.getElementById('submit-btn').style.display = 'block';

                // Reset frame style
                document.querySelector('.art-frame').classList.remove('revealed');

                try {
                    // Build query params
                    const params = new URLSearchParams();
                    params.append('new_card', 'true');
                    params.append('mode', 'art_detective');

                    const setVal = document.getElementById('setSelect').value;
                    if (setVal) params.append('set', setVal);

                    const colorVal = getFilterColors();
                    if (colorVal) params.append('colors', colorVal);

                    const formatVal = getFilterFormats();
                    if (formatVal) params.append('formats', formatVal);

                    // Add timestamp to prevent caching
                    params.append('ts', Date.now());

                    const res = await fetch('/get_card?' + params.toString());
                    const data = await res.json();

                    if (!data.art_crop) {
                        // Formatting fallback or retry
                        console.warn("No art crop", data);
                        loadCard(); // Retry
                        return;
                    }

                    currentCard = data;

                    if (gameMode === 'name') {
                        // Clear input
                        document.getElementById('card-name-input').value = '';
                        document.getElementById('suggestions').style.display = 'none';
                    }

                    // Preload image
                    const img = new Image();
                    img.onload = () => {
                        const artDisplay = document.getElementById('art-display');
                        artDisplay.classList.remove('loaded');
                        artDisplay.src = data.art_crop;
                        artDisplay.dataset.full = data.image; // Store full image URI
                        document.getElementById('loading-overlay').style.opacity = '0';
                        // Trigger fade-in animation
                        setTimeout(() => artDisplay.classList.add('loaded'), 10);

                        // Preload full image too?
                        if (data.image) {
                            new Image().src = data.image;
                        }
                    };
                    img.src = data.art_crop;

                } catch (e) {
                    console.error("Error loading card", e);
                }
            }

            // Autocomplete Setup
            function setupAutocomplete() {
                const input = document.getElementById('card-name-input');
                const list = document.getElementById('suggestions');

                input.oninput = async function () {
                    const val = this.value;
                    if (val.length < 2) {
                        list.style.display = 'none';
                        return;
                    }

                    try {
                        const res = await fetch(`https://api.scryfall.com/cards/autocomplete?q=${encodeURIComponent(val)}`);
                        if (res.ok) {
                            const data = await res.json();
                            showSuggestions(data.data);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                };

                // Close on click outside
                document.addEventListener('click', function (e) {
                    if (e.target !== input && e.target !== list) {
                        list.style.display = 'none';
                    }
                });
            }

            function showSuggestions(names) {
                const list = document.getElementById('suggestions');
                list.innerHTML = '';
                if (!names || names.length === 0) {
                    list.style.display = 'none';
                    return;
                }

                names.forEach(name => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.textContent = name;
                    item.onclick = function () {
                        document.getElementById('card-name-input').value = name;
                        list.style.display = 'none';
                        // Optional: Auto submit? No, lets let user click GUESS button.
                    };
                    list.appendChild(item);
                });
                list.style.display = 'flex';
            }

            function submitNameGuess() {
                if (isRevealed) return;

                const input = document.getElementById('card-name-input');
                const val = input.value.trim();

                if (!val) return;

                // Check exact match (case insensitive)
                const correct = val.toLowerCase() === currentCard.name.toLowerCase();

                handleResult(correct);
            }

            function updateLives() {
                let hearts = "";
                for (let i = 0; i < lives; i++) hearts += "❤️";
                for (let i = lives; i < 3; i++) hearts += "🖤";
                document.getElementById('lives-display').textContent = hearts;
            }

            async function submitToLeaderboard(score, streak = 0) {
                const username = prompt("🏆 Enter your name for the leaderboard (or leave blank for Anonymous):") || "Anonymous";

                try {
                    const response = await fetch('/api/submit_score', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            game_mode: 'art_detective',
                            score: score,
                            streak: streak,
                            username: username.trim().substring(0, 50)
                        })
                    });

                    const result = await response.json();

                    if (result.rank) {
                        alert(`🎉 You ranked #${result.rank} on the leaderboard!`);
                    }
                } catch (error) {
                    console.error('Failed to submit score:', error);
                }
            }

            async function resetGame() {
                // Submit score before resetting if game was played
                lives = 3;
                score = 0;
                document.getElementById('score').textContent = score;
                updateLives();
                document.getElementById('game-over-modal').classList.remove('show');
                loadCard(); // Start fresh
            }

            function submitGuess() {
                if (isRevealed) {
                    loadCard(); // Next card
                    return;
                }

                // Calculate correctness
                // Scryfall identity is array ["U", "B"]. Empty for colorless.
                let actual = new Set(currentCard.color_identity);

                // Handle Colorless logic
                let guessC = selectedColors.has('C');
                // If guess is C, actual must be empty.
                // If actual is empty, guess must be C (or empty? let's require C for colorless).

                let correct = false;

                if (actual.size === 0) {
                    correct = guessC;
                } else {
                    // Must match exactly? Or partial?
                    // "Art Detective" implies precision. Let's try Exact Match.
                    if (guessC) {
                        correct = false;
                    } else {
                        // Check sets equality
                        if (selectedColors.size === actual.size) {
                            correct = true;
                            for (let c of selectedColors) {
                                if (!actual.has(c)) {
                                    correct = false;
                                    break;
                                }
                            }
                        }
                    }
                }

                handleResult(correct);
                document.getElementById('submit-btn').style.display = 'none';
            }

            function handleResult(isCorrect) {
                isRevealed = true;
                const msgEl = document.getElementById('result-message');

                if (isCorrect) {
                    score++;
                    msgEl.textContent = "✅ Correct!";
                    msgEl.style.color = "#4caf50";
                } else {
                    msgEl.textContent = "❌ Wrong!";
                    msgEl.style.color = "#f44336";
                    lives--;
                    updateLives();
                    if (lives <= 0) {
                        submitToLeaderboard(score);
                        setTimeout(() => {
                            document.getElementById('final-score').textContent = score;
                            document.getElementById('game-over-modal').classList.add('show');

                        }, 1500);
                    }
                }
                document.getElementById('score').textContent = score;

                // Reveal Info
                document.getElementById('reveal-area').style.display = 'block';
                document.getElementById('card-name').textContent = currentCard.name;

                let identityStr = currentCard.color_identity.join("");
                if (identityStr === "") identityStr = "Colorless";
                document.getElementById('actual-colors').textContent = `Identity: ${identityStr}`;

                // Reveal Image
                const img = document.getElementById('art-display');
                const frame = document.querySelector('.art-frame');
                if (img.dataset.full) {
                    img.src = img.dataset.full;
                    img.alt = currentCard.name;
                    frame.classList.add('revealed');
                }

                // Show Next Button
                document.getElementById('next-btn').style.display = 'block';
            }

            // Init
            loadSets();

            // Filter Logic
            async function loadSets() {
                try {
                    const res = await fetch("/get_sets");
                    const sets = await res.json();
                    const select = document.getElementById("setSelect");
                    sets.forEach(s => {
                        const option = document.createElement("option");
                        option.value = s.code;
                        option.textContent = `${s.name} (${s.code.toUpperCase()})`;
                        select.appendChild(option);
                    });
                } catch (e) { console.error(e); }
            }

            function toggleFilters() {
                const container = document.getElementById('filter-container');
                const btn = document.getElementById('filter-toggle');
                if (container.style.display === 'none') {
                    container.style.display = 'block';
                    btn.style.background = 'rgba(97, 218, 251, 0.15)';
                    btn.style.borderColor = 'rgba(97, 218, 251, 0.4)';
                    btn.style.color = '#fff';
                } else {
                    container.style.display = 'none';
                    btn.style.background = '';
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }
            }

            function resetFilters() {
                document.getElementById('setSelect').value = "";
                document.querySelectorAll('.color-checkbox input').forEach(checkbox => checkbox.checked = true);
                document.querySelectorAll('.format-option').forEach(checkbox => checkbox.checked = false);
                resetGame();
            }

            function getFilterColors() {
                const colors = [];
                if (document.getElementById('colorW').checked) colors.push('W');
                if (document.getElementById('colorU').checked) colors.push('U');
                if (document.getElementById('colorB').checked) colors.push('B');
                if (document.getElementById('colorR').checked) colors.push('R');
                if (document.getElementById('colorG').checked) colors.push('G');

                const includeColorless = document.getElementById('colorC').checked;

                if (colors.length === 5 && includeColorless) return '';

                let query = '';
                if (colors.length > 0) {
                    query = 'c<=' + colors.join('');
                    if (!includeColorless) query += ' -c:C';
                }

                if (includeColorless && colors.length === 0) query = 'c:C';
                else if (includeColorless && colors.length > 0) query = '(' + query + ' OR c:C)';
                else if (!includeColorless && colors.length === 0) return ''; // Nothing selected? technically should return empty which scryfall interprets as all? or none? let's return empty.

                return query;
            }

            function getFilterFormats() {
                const selected = [];
                document.querySelectorAll('.format-option:checked').forEach(cb => selected.push(cb.value));
                return selected.join(',');
            }

            // Listeners for filters
            document.getElementById("setSelect").addEventListener("change", resetGame);
            document.querySelectorAll('.color-checkbox input').forEach(checkbox => {
                checkbox.addEventListener('change', resetGame);
            });
            document.querySelectorAll('.format-option').forEach(checkbox => {
                checkbox.addEventListener('change', resetGame);
            });

            loadCard(); // Initial Load

        </script>
</body>
